def secrets = System.getenv("GOOGLE_SERVICES_JSON")

apply plugin: "com.android.application"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

// Release signing comes from the environment (CI secrets or a local shell), never from the repository.
// A release is never signed with the public test key: if the real key is missing or is the test key,
// every task that produces a release artifact fails (see the task graph check at the end of this file).
// Debug builds, lint and unit tests don't need the key.
def releaseKeystoreFile = System.getenv("RELEASE_KEYSTORE_FILE")
def publicTestKeystore = rootProject.file("testkey.keystore")
def fileSha256 = { File file ->
    java.security.MessageDigest.getInstance("SHA-256").digest(file.bytes).encodeHex().toString()
}
def releaseKeyProblem = {
    if (!releaseKeystoreFile) return "RELEASE_KEYSTORE_FILE is not set"
    def keystore = new File(releaseKeystoreFile)
    if (!keystore.isFile()) return "RELEASE_KEYSTORE_FILE does not point to an existing file"
    for (name in ["RELEASE_STORE_PASSWORD", "RELEASE_KEY_ALIAS", "RELEASE_KEY_PASSWORD"]) {
        if (!System.getenv(name)) return "$name is not set"
    }
    if (System.getenv("RELEASE_KEY_ALIAS") == "testkey") return "the key alias is the public test key's"
    if (publicTestKeystore.isFile() && fileSha256(keystore) == fileSha256(publicTestKeystore)) {
        return "the keystore is the public test key"
    }
    return null
}.call()
def hasReleaseKey = releaseKeyProblem == null

android {
    compileSdk = 37

    def gitCommitHash = "git rev-parse HEAD".execute().text.trim()
    def shortCommitHash = "git rev-parse --short HEAD".execute().text.trim()

    defaultConfig {
        applicationId = "com.sketch_nws"
        namespace = "pro.sketchware"
        //noinspection ExpiredTargetSdkVersion since we don't target getting Sketchware Pro on Google Play.
        targetSdk = 28
        minSdk = 26
        versionCode = 152
        versionName = "v7.1.1"

        buildConfigField("String", "GIT_HASH", "\"${gitCommitHash}\"")
    }

    signingConfigs {
        debug {
            storeFile = file("../testkey.keystore")
            storePassword = "testkey"
            keyAlias = "testkey"
            keyPassword = "testkey"
        }
        if (hasReleaseKey) {
            release {
                storeFile = file(releaseKeystoreFile)
                storePassword = System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias = System.getenv("RELEASE_KEY_ALIAS")
                keyPassword = System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            // No fallback to the debug/test key: without the real key the release task graph is refused below.
            signingConfig = hasReleaseKey ? signingConfigs.release : null
        }
    }

    packagingOptions {
        resources.excludes += "license/*"
        resources.excludes += "META-INF/DEPENDENCIES"
        resources.pickFirsts += "api_database/*"
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    androidResources {
        additionalParameters.addAll("--stable-ids", "${rootDir}/public-stable-ids.txt")
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    lint {
        // Issues that already existed when lint was added to CI are recorded in the baseline; lint fails the
        // build only on new ones. Fix issues and refresh the file with `./gradlew :app:updateLintBaseline`.
        baseline = file("lint-baseline.xml")
    }

    testOptions {
        unitTests {
            // Unit tests run on the JVM; Android framework calls that aren't under test return defaults.
            returnDefaultValues = true
            includeAndroidResources = true
            all {
                // The prebuilt a.a.a jars hold old bytecode (no stack maps) that Android's dex tooling accepts but a
                // desktop JVM refuses to verify; tests that load their classes (the properties screen) need this.
                jvmArgs '-XX:+UnlockDiagnosticVMOptions', '-XX:-BytecodeVerificationRemote'
            }
        }
    }


    configurations.implementation {
        exclude group: 'javax.inject', module: 'javax.inject'
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-compiler-embeddable"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-common"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-jvm"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-script-runtime"
    }
}

configurations.configureEach { configuration ->
    if (!configuration.name.toLowerCase().contains("lint")) {
        configuration.exclude group: "xmlpull", module: "xmlpull"
        configuration.exclude group: "net.sf.kxml", module: "kxml2"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    // Robolectric needs the desktop build of Conscrypt; the Android one (an app dependency) can't load on the JVM.
    testImplementation libs.conscrypt.openjdk

    implementation libs.bundles.ui

    implementation libs.bundles.image

    implementation platform(libs.sora.editor)
    implementation libs.bundles.editor.and.lang

    implementation libs.bundles.coil

    implementation libs.bundles.bundletool
    implementation(libs.sdklib) {
        exclude group: "com.intellij", module: "annotations"
    }

    implementation libs.bundles.shrinker
    implementation libs.dalvik.dx
    implementation libs.zipalign.java
    implementation libs.apksig
    implementation libs.conscrypt.android
    implementation libs.androidsvg

    implementation libs.asm
    implementation libs.stringfog.core
    implementation libs.stringfog.interface
    implementation libs.stringfog.xor

    implementation libs.gson
    implementation libs.scpkix.jdk15on

    implementation libs.markwon

    implementation libs.bundles.networking

    implementation libs.ecj
    implementation libs.jgit

    implementation libs.bundles.kotlin.compiler
    compileOnly libs.kotlin.compiler

    implementation libs.dependencyresolver
    implementation libs.filepicker

    implementation libs.libsu
    implementation libs.insetter

    implementation(libs.javaparser.symbol.solver) {
        exclude group: "com.google.guava", module: "guava"
    }

    implementation platform(libs.firebase.bom)
    implementation libs.bundles.firebase

    coreLibraryDesugaring libs.desugar.jdk.libs.nio
}

apply from: "$rootDir/gradle/custom-tasks.gradle"

// Refuse to produce any release artifact (APK, bundle, install) without the real private release key.
gradle.taskGraph.whenReady { graph ->
    def releaseArtifactTask = ~/^(assemble|bundle|package|install)(\w*)Release$/
    def requested = graph.allTasks.findAll { it.project == project && it.name ==~ releaseArtifactTask }
    if (!requested.isEmpty() && releaseKeyProblem != null) {
        throw new GradleException("Refusing to build a release without the real release key: ${releaseKeyProblem}. " +
                "Set RELEASE_KEYSTORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD. " +
                "Releases are never signed with the public test key.")
    }
}


// The Android build of Conscrypt can't load on the JVM; unit tests use the desktop build instead.
configurations.matching { it.name.startsWith('test') || it.name.contains('UnitTest') }.configureEach {
    exclude group: 'org.conscrypt', module: 'conscrypt-android'
}
