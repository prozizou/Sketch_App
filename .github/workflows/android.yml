name: Android CI

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
      - 'testkey.keystore'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
      - 'testkey.keystore'
  workflow_dispatch:

# Least privilege. Pull requests (including ones from forks) never see the release secrets:
# they only run the "verify" job below, the signed release build runs on pushes.
permissions:
  contents: read

jobs:
  notifyTelegram:
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/wip/') }}
    name: Notify Telegram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Send a message to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          python ./.github/workflows/notify_telegram.py
        continue-on-error: true

  verify:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: A release build must be refused without the release key
        # No RELEASE_* variable is set in this job, so this has to fail, and for the right reason:
        # a release is never signed with the public test key.
        run: |
          set +e
          gradle :app:assembleRelease --console=plain > "$RUNNER_TEMP/release-guard.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::assembleRelease succeeded without a release key: the signing guard is broken."
            exit 1
          fi
          if ! grep -q "Refusing to build a release without the real release key" "$RUNNER_TEMP/release-guard.log"; then
            tail -n 60 "$RUNNER_TEMP/release-guard.log"
            echo "::error::assembleRelease failed, but not because of the release signing guard."
            exit 1
          fi
          echo "assembleRelease is refused without a release key, as intended."

      - name: Build debug APK, run lint and unit tests
        run: gradle :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --console=plain

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: verify-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/theme-renders/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  build:
    name: Build APKs
    # Pull requests only run "verify": they have no access to the release secrets.
    if: ${{ github.event_name != 'pull_request' }}
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set environmental variables
        shell: bash
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.JSON_CONTENT != '' }}
        run: |
          printf 'GOOGLE_SERVICES_JSON<<EOF\n%s\nEOF\n' "$JSON_CONTENT" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore
        # The release APK is only ever built with the private release key: a missing secret fails the build.
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$RELEASE_STORE_PASSWORD" ] || missing="$missing RELEASE_STORE_PASSWORD"
          [ -n "$RELEASE_KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$RELEASE_KEY_PASSWORD" ] || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secret(s):$missing. A release is never signed with the public test key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check release signing secrets
        # Fails the build when a secret is wrong, without ever printing a value.
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          failed=0
          check_value() {
            local name="$1" value="${!1}"
            if [ -z "$value" ]; then
              echo "::error::Secret $name is EMPTY or missing."
              failed=1
            elif [ "$value" != "$(printf '%s' "$value" | tr -d '[:space:]')" ]; then
              echo "::error::Secret $name contains a space or line break (usually a trailing one from copy/paste). Re-enter it by hand."
              failed=1
            else
              echo "Secret $name: present, no whitespace."
            fi
          }
          check_value RELEASE_STORE_PASSWORD
          check_value RELEASE_KEY_ALIAS
          check_value RELEASE_KEY_PASSWORD

          if [ ! -s "$RELEASE_KEYSTORE_FILE" ]; then
            echo "::error::The decoded keystore file is empty. RELEASE_KEYSTORE_BASE64 is wrong or truncated."
            exit 1
          fi
          echo "Keystore file decoded: $(stat -c %s "$RELEASE_KEYSTORE_FILE") bytes."
          [ "$failed" -eq 0 ] || exit 1

          java .github/workflows/CheckSigning.java | tee "$RUNNER_TEMP/signing-check.txt"
          grep -q "Signing should work" "$RUNNER_TEMP/signing-check.txt"

      - name: Build Release APK
        # Test build for arm64 phones only (about 13 MB smaller). Published releases (release.yml) stay universal.
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease -PabiOnly=arm64-v8a

      - name: Check the APK only has arm64 code
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          files=$(unzip -Z1 "$apk")
          if echo "$files" | grep -Eq '^lib/(x86|x86_64|armeabi-v7a)/|^assets/aapt/aapt2-(x86|x86_64|armeabi-v7a)$'; then
            echo "::error::The arm64 test APK still contains code for other architectures."
            exit 1
          fi
          if ! echo "$files" | grep -q '^assets/aapt/aapt2-arm64-v8a$'; then
            echo "::error::The arm64 test APK lost assets/aapt/aapt2-arm64-v8a: builds would fail on the phone."
            exit 1
          fi
          echo "arm64 only, $(stat -c %s "$apk") bytes."

      - name: Check the pinned resource ID
        # Precompiled classes refer to string/root_spec_common_when by its number (see public-stable-ids.txt).
        # If aapt2 stops honouring it (e.g. after an applicationId change) the Logic editor crashes at runtime.
        run: |
          aapt2=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -1)
          dump=$("$aapt2" dump resources app/build/outputs/apk/release/app-release.apk | grep 'string/root_spec_common_when' || true)
          echo "$dump"
          if ! echo "$dump" | grep -q '0x7f0e082a'; then
            echo "::error::string/root_spec_common_when is not 0x7f0e082a in the APK: the Logic editor would crash. Check public-stable-ids.txt (one line per package name used by aapt2)."
            exit 1
          fi

      - name: Check the APK is signed with the release key
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          apksigner=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          apk_sha=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')
          key_sha=$(keytool -list -v -keystore "$RELEASE_KEYSTORE_FILE" -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          test_sha=$(keytool -list -v -keystore testkey.keystore -storepass testkey -alias testkey | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$apk_sha" ] || [ "$apk_sha" != "$key_sha" ]; then
            echo "::error::The APK is not signed with the release key."
            exit 1
          fi
          if [ "$apk_sha" = "$test_sha" ]; then
            echo "::error::The APK is signed with the public test key."
            exit 1
          fi
          echo "APK signing certificate matches the release key: $apk_sha"

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Rename APK with commit hash
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk

  publishDev:
    # Each build of main becomes a "dev-N" prerelease announced in update-dev.json on the dev-channel branch, so a
    # phone on the dev update channel (App Settings > Updates) installs it in one tap. Releases are immutable, hence
    # one prerelease per build; only the newest few are kept.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Publish dev build
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-channel
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SHORT_SHA: ${{ needs.build.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Download the APK
        uses: actions/download-artifact@v8
        with:
          name: apk-release-${{ needs.build.outputs.short_sha }}
          path: ./dist

      - name: Publish the prerelease
        id: publish
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle)
          tag="dev-${GITHUB_RUN_NUMBER}"
          # A re-run keeps the run number; release tags can't be reused.
          [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] && tag="${tag}-${GITHUB_RUN_ATTEMPT}"
          apk="dist/NewWorldSketchware-dev-arm64.apk"
          mv "dist/app-release-${SHORT_SHA}.apk" "$apk"
          sha=$(sha256sum "$apk" | awk '{print $1}')
          message=$(git log -1 --pretty=format:'%s')
          printf 'Test build of main at %s (arm64 phones only), not a release.\n\n%s\n\nSHA-256: `%s`\n' "$SHORT_SHA" "$message" "$sha" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$apk" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "NWS dev build $SHORT_SHA" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "code=$code"
            echo "name=$name"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Announce it in update-dev.json on the dev-channel branch
        env:
          CODE: ${{ steps.publish.outputs.code }}
          NAME: ${{ steps.publish.outputs.name }}
          TAG: ${{ steps.publish.outputs.tag }}
          SHA: ${{ steps.publish.outputs.sha }}
        run: |
          message=$(git log -1 --pretty=format:'%s')
          workdir="$RUNNER_TEMP/dev-channel"
          mkdir -p "$workdir"
          cd "$workdir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin dev-channel; then
            git checkout -q -B dev-channel FETCH_HEAD
          else
            git checkout -q --orphan dev-channel
          fi
          MESSAGE="$message" python3 - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          manifest = {
              "versionCode": int(os.environ["CODE"]),
              "versionName": f'{os.environ["NAME"]}-dev ({os.environ["SHORT_SHA"]})',
              # The app offers a build with its own versionCode when this commit differs from its own.
              "commit": os.environ["GITHUB_SHA"],
              "mandatory": False,
              "url": f"https://github.com/{repo}/releases/tag/{tag}",
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/NewWorldSketchware-dev-arm64.apk",
              "sha256": os.environ["SHA"],
              "notes": "Dev build (arm64): " + os.environ["MESSAGE"],
          }
          with open("update-dev.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          git add update-dev.json
          git commit -q -m "dev: announce $TAG ($SHORT_SHA)"
          git push -q origin HEAD:dev-channel

      - name: Keep only the newest dev builds
        continue-on-error: true
        run: |
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -E '^dev-[0-9]+(-[0-9]+)?$' | sort -t- -k2 -n -r | tail -n +4 \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done

  aggregateAndSend:
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/wip/') }}
    name: Send APKs to Telegram
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: apk-release-${{ needs.build.outputs.short_sha }}
          path: ./downloaded-artifact

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install telethon

      - name: Get Git Commit Info
        run: |
          echo "COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: Restore Telegram session cache
        uses: actions/cache@v5
        id: telegram_session_cache
        with:
          path: bot_session.session
          key: telegram-session-${{ runner.os }}-bot_session

      - name: Send APKs to Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          APK_PATH: ./downloaded-artifact/app-release-${{ needs.build.outputs.short_sha }}.apk
        run: |
          python ./.github/workflows/deploy_artifacts.py
        continue-on-error: true

  updateAppData:
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/wip/') }}
    name: Update App Data
    # Pushes about.json to the host branch with the job's token, so it needs write access.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Update App Script
        run: python .github/workflows/update_app_data.py

      - name: Commit and Push Changes
        env:
          GH_ABOUT_APP_WORKFLOW_TOKEN: ${{ secrets.GH_ABOUT_APP_WORKFLOW_TOKEN }}
        run: |
          git checkout host
          git config --global user.name "Sketchware Pro Actions"
          git config --global user.email "hello@sketchware.pro"
          git add about.json
          git commit -m "feat: Update app about screen data"
          git push
        continue-on-error: true
      
