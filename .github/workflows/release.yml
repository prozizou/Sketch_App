name: Release

# Builds the release APK signed with the private release key, publishes it as a GitHub Release and points
# update.json (read by the in-app updater) at it. Run it from the Actions tab once versionCode/versionName
# were bumped in app/build.gradle.
#
# Nothing is published unless: the release key secrets are set, the APK really is signed with that key,
# versionCode is higher than the one currently announced in update.json, and the tag does not exist yet.

on:
  workflow_dispatch:
    inputs:
      mandatory:
        description: 'Force the update (the dialog cannot be dismissed)'
        type: boolean
        default: true
      notes:
        description: 'Message shown in the update dialog'
        type: string
        default: 'A new version of New World Sketchware is available. Please update to continue.'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APK_NAME: NewWorldSketchware.apk
  RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
  RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
  RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

jobs:
  release:
    name: Build, publish and announce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Read the version
        id: version
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle)
          if [ -z "$code" ] || [ -z "$name" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle."
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Releasing $name (versionCode $code)"

      - name: Check the version is new
        env:
          CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.name }}
        run: |
          current=$(git show origin/main:update.json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("versionCode", 0))' 2>/dev/null || echo 0)
          echo "versionCode announced on main: $current, this build: $CODE"
          if [ "$CODE" -le "$current" ]; then
            echo "::error::versionCode $CODE is not higher than the $current already announced. Bump versionCode in app/build.gradle first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::The tag $TAG already exists. Bump versionName in app/build.gradle first."
            exit 1
          fi

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::A release signing secret is missing. A release is never signed with the public test key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check the signing secrets
        run: |
          java .github/workflows/CheckSigning.java | tee "$RUNNER_TEMP/signing-check.txt"
          grep -q "Signing should work" "$RUNNER_TEMP/signing-check.txt"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run the unit tests
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Build the release APK
        run: gradle assembleRelease

      - name: Check the pinned resource ID
        # Precompiled classes refer to string/root_spec_common_when by its number (see public-stable-ids.txt).
        # If aapt2 stops honouring it (e.g. after an applicationId change) the Logic editor crashes at runtime.
        run: |
          aapt2=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -1)
          dump=$("$aapt2" dump resources app/build/outputs/apk/release/app-release.apk | grep 'string/root_spec_common_when' || true)
          echo "$dump"
          if ! echo "$dump" | grep -q '0x7f0e082a'; then
            echo "::error::string/root_spec_common_when is not 0x7f0e082a in the APK: the Logic editor would crash. Check public-stable-ids.txt (one line per package name used by aapt2)."
            exit 1
          fi

      - name: Check the APK is signed with the release key
        run: |
          apksigner=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          apk_sha=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')
          key_sha=$(keytool -list -v -keystore "$RELEASE_KEYSTORE_FILE" -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$apk_sha" ] || [ "$apk_sha" != "$key_sha" ]; then
            echo "::error::The APK is not signed with the release key. Nothing was published."
            exit 1
          fi
          echo "APK signing certificate matches the release key: $apk_sha"

      - name: Prepare the files
        id: files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          sha=$(sha256sum "dist/$APK_NAME" | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $sha"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.name }}
          SHA: ${{ steps.files.outputs.sha }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n\nSHA-256 of %s:\n`%s`\n' "$NOTES" "$APK_NAME" "$SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "dist/$APK_NAME" \
            --title "New World Sketchware $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Announce it in update.json on main
        env:
          CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.name }}
          SHA: ${{ steps.files.outputs.sha }}
          MANDATORY: ${{ inputs.mandatory }}
          NOTES: ${{ inputs.notes }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          manifest = {
              "versionCode": int(os.environ["CODE"]),
              "versionName": tag,
              "mandatory": os.environ["MANDATORY"] == "true",
              "url": f"https://github.com/{repo}/releases/tag/{tag}",
              # Immutable: points at this tag's asset, never at "latest" (which moves with every release).
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{os.environ['APK_NAME']}",
              "sha256": os.environ["SHA"],
              "notes": os.environ["NOTES"],
          }
          with open("update.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "release: announce $TAG (versionCode $CODE) in update.json"
          git push origin HEAD:main
